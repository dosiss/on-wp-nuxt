name: Deploy to VPS
on:
  push:
    branches: [ruvds-webshop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update code
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 10m
          script: |
            cd /var/www/on-webshop
            git checkout ruvds-webshop
            git pull origin ruvds-webshop
            npm ci --prefer-offline --no-audit
      
      - name: Build application
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30m
          command_timeout: 30m
          script: |
            cd /var/www/on-webshop
            NODE_OPTIONS="--max-old-space-size=4096" npm run build
      
      - name: Restart application
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 2m
          script: |
            cd /var/www/on-webshop
            # Restart if exists, start if not
            pm2 describe on-webshop > /dev/null 2>&1 && pm2 restart on-webshop || PORT=3001 pm2 start .output/server/index.mjs --name on-webshop
            pm2 save