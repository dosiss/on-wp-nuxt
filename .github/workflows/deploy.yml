name: Deploy to VPS
on:
  push:
    branches: [ruvds-webshop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: NODE_OPTIONS="--max-old-space-size=4096" npm run build

      - name: Transfer build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: ".output/"
          target: "/var/www/on-webshop"

      - name: Restart application
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/on-webshop
            # Delete the old process to ensure a clean start with new environment/paths
            pm2 delete on-webshop || true
            PORT=3001 HOST=0.0.0.0 pm2 start .output/server/index.mjs --name on-webshop
            pm2 save